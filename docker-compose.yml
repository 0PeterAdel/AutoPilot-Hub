# ═══════════════════════════════════════════════════
#       AutoPilot-Hub - Docker Compose
#       Main Production Configuration
# ═══════════════════════════════════════════════════

version: '3.9'

# ── Shared Network ──
networks:
  autopilot-network:
    driver: bridge
    name: autopilot-network

# ── Persistent Volumes ──
volumes:
  postgres-data:
    name: autopilot-postgres-data
  redis-data:
    name: autopilot-redis-data
  rabbitmq-data:
    name: autopilot-rabbitmq-data
  ollama-data:
    name: autopilot-ollama-data
  browser-data:
    name: autopilot-browser-data
  shared-data:
    name: autopilot-shared-data

services:

  # ════════════════════════════════
  #     INFRASTRUCTURE SERVICES
  # ════════════════════════════════

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: autopilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autopilot_hub}
      POSTGRES_USER: ${POSTGRES_USER:-autopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - autopilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autopilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache ──
  redis:
    image: redis:7-alpine
    container_name: autopilot-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - autopilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ Message Broker ──
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: autopilot-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-autopilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-autopilot}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - autopilot-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Ollama (Local LLM) ──
  ollama:
    image: ollama/ollama:latest
    container_name: autopilot-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - autopilot-network
    # Uncomment below for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ════════════════════════════════
  #       APPLICATION SERVICES
  # ════════════════════════════════

  # ── Main Agent (Orchestrator) ──
  main-agent:
    build:
      context: .
      dockerfile: main-agent/Dockerfile
    container_name: autopilot-main-agent
    restart: unless-stopped
    env_file: .env
    volumes:
      - shared-data:/app/shared-data
      - ./shared:/app/shared
    ports:
      - "${MAIN_AGENT_PORT:-8000}:8000"
    networks:
      - autopilot-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Freelancer Service ──
  freelancer-service:
    build:
      context: .
      dockerfile: freelancer-service/Dockerfile
    container_name: autopilot-freelancer
    restart: unless-stopped
    env_file: .env
    volumes:
      - shared-data:/app/shared-data
      - browser-data:/app/browser-data
      - ./shared:/app/shared
    ports:
      - "${FREELANCER_SERVICE_PORT:-8001}:8001"
    networks:
      - autopilot-network
    depends_on:
      main-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Email Service ──
  email-service:
    build:
      context: .
      dockerfile: email-service/Dockerfile
    container_name: autopilot-email
    restart: unless-stopped
    env_file: .env
    volumes:
      - shared-data:/app/shared-data
      - ./shared:/app/shared
    ports:
      - "${EMAIL_SERVICE_PORT:-8002}:8002"
    networks:
      - autopilot-network
    depends_on:
      main-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── DevEnv Service ──
  devenv-service:
    build:
      context: .
      dockerfile: devenv-service/Dockerfile
    container_name: autopilot-devenv
    restart: unless-stopped
    env_file: .env
    volumes:
      - shared-data:/app/shared-data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./shared:/app/shared
    ports:
      - "${DEVENV_SERVICE_PORT:-8003}:8003"
    networks:
      - autopilot-network
    depends_on:
      main-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Bug Hunter Service ──
  bughunter-service:
    build:
      context: .
      dockerfile: bughunter-service/Dockerfile
    container_name: autopilot-bughunter
    restart: unless-stopped
    env_file: .env
    volumes:
      - shared-data:/app/shared-data
      - ./shared:/app/shared
    ports:
      - "${BUGHUNTER_SERVICE_PORT:-8004}:8004"
    networks:
      - autopilot-network
    depends_on:
      main-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Telegram Bot ──
  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    container_name: autopilot-telegram
    restart: unless-stopped
    env_file: .env
    volumes:
      - shared-data:/app/shared-data
      - ./shared:/app/shared
    networks:
      - autopilot-network
    depends_on:
      main-agent:
        condition: service_healthy

  # ── Dashboard ──
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: autopilot-dashboard
    restart: unless-stopped
    env_file: .env
    volumes:
      - shared-data:/app/shared-data
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    networks:
      - autopilot-network
    depends_on:
      main-agent:
        condition: service_healthy
